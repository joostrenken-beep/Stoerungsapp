name: LinkedIn-Entwurf "60 Sekunden Wasserwirtschaft"

on:
  schedule:
    # Di, Do, Fr. GitHub rechnet in UTC: 03:10 UTC = 05:10 Sommerzeit,
    # 04:10 UTC = 05:10 Winterzeit. Das Skript wartet bis 05:30 Uhr und
    # sorgt dafür, dass pro Tag nur ein Entwurf verschickt wird.
    - cron: "10 3 * * 2,4,5"
    - cron: "10 4 * * 2,4,5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: linkedin60
  cancel-in-progress: false

jobs:
  entwurf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: linkedin60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkedin60/requirements.txt

      - run: pip install -r requirements.txt

      - name: Entwurf erstellen und senden
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO || 'joost.renken@gmail.com' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python generate_post.py

      - name: Verlauf speichern
        run: |
          if ! git diff --quiet history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "linkedin60: Verlauf aktualisiert"
            git push
          fi
